services:
  video:
    image: ossrs/srs:5
    container_name: multik-tv-cloud-video
    init: true
    restart: unless-stopped
    command: ["./objs/srs", "-c", "conf/srs.conf"]
    ports:
      - "1935:1935"
    volumes:
      - ./srs.conf:/usr/local/srs/conf/srs.conf:ro
      - hls-data:/usr/local/srs/objs/nginx/html
    networks: [broadcast]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  control:
    build: .
    container_name: multik-tv-cloud-control
    init: true
    restart: unless-stopped
    depends_on: [video]
    environment:
      PORT: "8080"
      HLS_DIR: /hls
    ports:
      - "8080:8080"
    volumes:
      - hls-data:/hls:ro
    networks: [broadcast]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hls-data:

networks:
  broadcast:

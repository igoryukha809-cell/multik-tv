<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Каталог опубликованных выпусков. Здесь отображаются только материалы, которые добавлены в открытый плейлист канала и имеют подтверждённые права."><title>Архив передач</title><style>
:root{--ink:#302d52;--muted:#77758d;--purple:#6245b8;--pink:#ed6099;--line:#eae8f1}*{box-sizing:border-box}body{margin:0;color:var(--ink);font:16px/1.5 system-ui,Arial;background:#fff}.rainbow{height:6px;background:linear-gradient(90deg,#f15e9c,#ffd65a,#67cda7,#52c7e8,#9273e6)}header{border-bottom:1px solid var(--line);padding:14px max(18px,calc((100% - 1080px)/2));display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}header a{color:var(--purple);font-weight:900;text-decoration:none}.nav{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}.nav a{color:#514d6c;text-decoration:none}main{max-width:1000px;margin:auto;padding:24px 18px 52px}.hero{padding:26px;border-radius:22px;background:linear-gradient(110deg,#4933a5,#7652c8 58%,#ed80ae);color:white}.hero h1{font-size:clamp(30px,6vw,46px);margin:6px 0}.muted{color:var(--muted)}.hero p{margin-bottom:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:20px 0}.card,.panel{border:1px solid var(--line);border-radius:18px;padding:18px;background:white}.card h2,.card h3{margin:6px 0}.emoji{font-size:38px}.btn,button{border:0;border-radius:11px;padding:11px 15px;background:var(--purple);color:white;font:inherit;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.btn.alt,button.alt{background:#f0ebfa;color:var(--purple)}input,select,textarea{font:inherit;padding:10px;border:1px solid #d9d3e7;border-radius:10px;max-width:100%}label{display:grid;gap:5px;margin:10px 0}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #f2b84b;outline-offset:2px}footer{padding:22px;text-align:center;color:var(--muted);border-top:1px solid var(--line)}.result{font-weight:850;color:var(--purple);margin-top:12px}@media(max-width:600px){header{padding:12px 16px}.nav{gap:10px;font-size:12px}}
</style></head><body><div class="rainbow"></div><header><a href="index.html">🌈 Наш телеканал</a><nav class="nav"><a href="guide.html">Телепрограмма</a><a href="live.html">Эфир</a><a href="games.html">Игры</a><a href="gallery.html">Галерея</a><a href="programs.html">Передачи</a><a href="online-catalog.html">Видеотека</a></nav></header><main><section class="hero"><div>🗂️ ИСТОРИЯ ЭФИРА</div><h1>Архив передач</h1><p>Каталог опубликованных выпусков. Здесь отображаются только материалы, которые добавлены в открытый плейлист канала и имеют подтверждённые права.</p></section>
<section class="panel"><label>Поиск по названию<input id="search" type="search" placeholder="Название передачи"></label><p id="status" class="muted" aria-live="polite">Загружаем архив…</p><div class="grid" id="archive"></div></section></main><footer>© Наш телеканал · Оригинальные проекты</footer><script>const list=document.getElementById('archive'),status=document.getElementById('status');let items=[];function show(){const q=document.getElementById('search').value.toLocaleLowerCase('ru');list.replaceChildren();const filtered=items.filter(x=>String(x.title||'').toLocaleLowerCase('ru').includes(q));if(!filtered.length){status.textContent=items.length?'По этому запросу ничего не найдено.':'Архив пока пуст.';return}status.textContent='Материалов: '+filtered.length;filtered.forEach(x=>{const a=document.createElement('a');a.className='card';a.href=x.url;a.target='_blank';a.rel='noopener';const h=document.createElement('h3');h.textContent=x.title||'Выпуск канала';const p=document.createElement('p');p.textContent=x.date||'Опубликованный материал';a.append(h,p);list.append(a)})}document.getElementById('search').oninput=show;fetch('./broadcast/playlist.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{items=(d.items||[]).filter(x=>x.rightsConfirmed===true&&x.url);show()}).catch(()=>{status.textContent='Не удалось загрузить плейлист. Попробуй позже.'});</script></body></html>

<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6045bd"><title>Рисование — детский телеканал</title><style>
*{box-sizing:border-box}body{margin:0;color:#302d52;font:16px/1.55 system-ui,Arial,sans-serif;background:#fff}a{color:#6045bd;text-decoration:none}.rainbow{height:6px;background:linear-gradient(90deg,#f15e9c,#ffd65a,#67cda7,#52c7e8,#9273e6)}header,main,footer{max-width:1080px;margin:auto;padding:18px}.brand{font-weight:1000;color:#6045bd;font-size:20px}nav{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:13px;font-weight:850}nav a{color:#514d6c}.hero{padding:26px;border-radius:20px;background:linear-gradient(120deg,#4933a5,#7652c8 58%,#ed80ae);color:white}.hero h1{font-size:clamp(30px,6vw,46px);margin:4px 0}.muted{color:#77758d}.panel,.card{border:1px solid #eae6f2;border-radius:17px;padding:18px;margin:16px 0;background:white}.btn,button{border:0;border-radius:11px;padding:11px 15px;background:#6045bd;color:white;font:inherit;font-weight:850;cursor:pointer}.btn.alt,button.alt{background:#f1edfb;color:#6045bd}input,textarea,select{width:100%;padding:11px;border:1px solid #dcd5e8;border-radius:10px;font:inherit;margin:5px 0 12px}label{display:block;font-weight:800;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.note{padding:12px;border-radius:12px;background:#fff6df;color:#72551e;font-size:13px}.art{font-size:40px}@media(max-width:560px){header,main,footer{padding:13px}nav{gap:9px;font-size:12px}}
</style></head><body><div class="rainbow"></div><header><a class="brand" href="index.html">🌈 Наш телеканал</a><nav><a href="index.html">Главная</a><a href="reader.html">Читалка</a><a href="drawing.html">Рисование</a><a href="profile.html">Профиль</a><a href="gallery.html">Галерея</a><a href="vlogs.html">Видеоблоги</a><a href="rewards.html">Копилка</a><a href="leaderboard.html">Рейтинг</a></nav></header><main><section class="hero"><div>🎨 ТВОРЧЕСКАЯ МАСТЕРСКАЯ</div><h1>Рисуй и раскрашивай</h1><p>Создай рисунок прямо на странице. Работа сохраняется только на этом устройстве.</p></section><section class="panel"><div class="grid"><label>Цвет кисти<input type="color" id="color" value="#6548b8"></label><label>Толщина линии<input type="range" id="width" min="1" max="30" value="6"></label></div><canvas id="pad" width="900" height="520" style="width:100%;height:auto;border:2px dashed #cfc5e3;border-radius:12px;touch-action:none;background:white"></canvas><p><button id="clear" class="alt">Очистить</button> <button id="save">Скачать рисунок</button></p></section></main><footer class="muted">© Наш телеканал · Не публикуй личные данные</footer><script>const c=document.getElementById("pad"),x=c.getContext("2d");let down=false,last=null;x.lineCap="round";function point(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}c.addEventListener("pointerdown",e=>{down=true;last=point(e);c.setPointerCapture(e.pointerId)});c.addEventListener("pointermove",e=>{if(!down)return;const p=point(e);x.strokeStyle=document.getElementById("color").value;x.lineWidth=+document.getElementById("width").value;x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p});["pointerup","pointercancel","pointerleave"].forEach(t=>c.addEventListener(t,()=>down=false));document.getElementById("clear").onclick=()=>x.clearRect(0,0,c.width,c.height);document.getElementById("save").onclick=()=>{const a=document.createElement("a");a.download="moy-risunok.png";a.href=c.toDataURL("image/png");a.click()};</script></body></html>

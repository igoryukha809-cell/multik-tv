<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#21194e">
<title>Вход — телеканал</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 10%,#354b89,#10162c 55%,#090d19);font:16px system-ui;color:#fff}.panel{width:min(100%,440px);padding:30px;border:1px solid #ffffff25;border-radius:24px;background:#141d35ef;box-shadow:0 20px 70px #0008}h1{margin:0 0 8px;font-size:28px}p{color:#c5cee4;line-height:1.5}.hint{font-size:13px;color:#aab7d4}button{width:100%;padding:14px;border:0;border-radius:12px;background:#1687e8;color:white;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.status{min-height:48px;margin-top:14px;color:#ffe08a;overflow-wrap:anywhere;white-space:pre-wrap}a{color:#ffda73}
</style>
</head>
<body><main class="panel">
<h1>Вход в аккаунт</h1>
<p>Войдите с помощью своего аккаунта ВКонтакте через VK ID.</p>
<p class="hint">Отдельный пароль на сайте не создаётся. Мы не просим сообщать пароль или коды подтверждения в чате.</p>
<button id="vk" type="button">Войти через VK ID</button>
<div class="status" id="status" role="status" aria-live="polite"></div>
<p class="hint">Авторизация защищается Logto. Доступ к административным функциям дополнительно проверяется сервером.</p>
<p><a href="./index.html">← На главную</a></p>
</main>
<script type="module">
import LogtoClient from 'https://cdn.jsdelivr.net/npm/@logto/browser@3.1.2/+esm';
import {LOGTO_ENDPOINT,LOGTO_APP_ID,LOGTO_API_RESOURCE,LOGTO_REDIRECT_URI} from './logto-config.js';
const client=new LogtoClient({endpoint:LOGTO_ENDPOINT,appId:LOGTO_APP_ID,resources:[LOGTO_API_RESOURCE]});
const button=document.querySelector('#vk'),status=document.querySelector('#status');
button.addEventListener('click',async()=>{
 button.disabled=true;status.textContent='Открываем защищённый вход VK ID…';
 try{await client.signIn({redirectUri:LOGTO_REDIRECT_URI,directSignIn:'social:vk'});}
 catch(error){button.disabled=false;status.textContent='Вход пока не настроен. Проверьте VK ID OAuth-коннектор в Logto. '+(error?.message||'');}
});
(async()=>{try{if(await client.isAuthenticated()){status.textContent='Вы уже вошли. Открываем защищённый раздел…';location.replace('./access-keys.html');}}catch(error){status.textContent='Не удалось проверить сессию. Нажмите кнопку входа ещё раз.';}})();
</script>
</body></html>

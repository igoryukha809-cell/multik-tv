name: Publish МУЛЬТИК ТВ

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify published pages and broadcast status
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for page in index.html channel.html live.html online-catalog.html video-studio.html tv.html open-animation.html guide.html weather-show.html games.html; do
            echo "Checking $page"
            curl --fail --silent --show-error --retry 5 --retry-delay 3 "$SITE_URL$page" -o /dev/null
          done
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$SITE_URL/live.html" -o /tmp/live.html
          grep -q 'id="maintenance"' /tmp/live.html
          grep -q '.screen:before' /tmp/live.html
          echo "Live page contains the maintenance slate and a non-collapsing 16:9 viewport."
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$SITE_URL/broadcast/status.json" -o /tmp/broadcast-status.json
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("/tmp/broadcast-status.json").read_text(encoding="utf-8"))
          required = {"channel", "state", "checkedAt", "itemsChecked", "errors", "streaming"}
          missing = required - status.keys()
          if missing:
              raise SystemExit(f"Broadcast status missing fields: {sorted(missing)}")
          if status["streaming"] is True:
              raise SystemExit("Static deployment must not claim a live stream without a verified streaming monitor.")
          print(f"Broadcast status verified: {status['state']}; streaming={status['streaming']}")
          PY

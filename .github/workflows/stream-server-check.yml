name: Validate МУЛЬТИК ТВ video server

on:
  push:
    branches: [main]
    paths:
      - "stream-server/**"
      - "broadcast/**"
      - "scripts/**"
      - ".github/workflows/stream-server-check.yml"
  pull_request:
    paths:
      - "stream-server/**"
      - "broadcast/**"
      - "scripts/**"
      - ".github/workflows/stream-server-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stream-server-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Docker, playlist and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate JSON configuration
        run: |
          python -m json.tool broadcast/playlist.json > /dev/null
          python -m json.tool broadcast/status.json > /dev/null
          python -m json.tool broadcast.json > /dev/null
          echo "JSON configuration is valid."

      - name: Run playlist unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Compile runtime auto-repair agent
        run: python -m py_compile scripts/stream_autorepair.py

      - name: Compile AI repair agent
        run: python -m py_compile scripts/ai_stream_repair.py

      - name: Check shell script syntax
        run: |
          bash -n stream-server/playlist/loop.sh
          bash -n stream-server/render-start.sh

      - name: Validate Docker Compose configuration
        working-directory: stream-server
        run: docker compose config --quiet

      - name: Build FFmpeg playlist image
        run: docker build --tag multik-tv-playlist:ci stream-server/playlist

      - name: Build cloud HLS broadcast image
        run: docker build --file stream-server/Dockerfile --tag multik-tv-render:ci stream-server

      - name: Confirm required server files
        run: |
          test -s stream-server/srs.conf
          test -s stream-server/docker-compose.yml
          test -s stream-server/playlist/Dockerfile
          test -s stream-server/playlist/loop.sh
          test -s scripts/check_broadcast.py
          test -s scripts/test_check_broadcast.py
          echo "All required server files are present."

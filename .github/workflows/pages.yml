name: Publish МУЛЬТИК ТВ to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required site files
        run: |
          set -eu
          for file in index.html live.html guide.html online-catalog.html studio.html engine.html diagnostics.html broadcast/status.json broadcast/playlist.json; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done
          node -e "for (const f of ['broadcast/status.json','broadcast/playlist.json']) JSON.parse(require('fs').readFileSync(f,'utf8')); console.log('Required pages and broadcast JSON are valid.')"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          retention-days: 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

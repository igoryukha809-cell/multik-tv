name: Stream runtime auto-diagnostics
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'stream-server/**'
      - '.github/workflows/stream-runtime-autodiagnostics.yml'
      - 'live.html'
      - 'broadcast.json'
      - 'render.yaml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
concurrency:
  group: stream-runtime-autodiagnostics
  cancel-in-progress: true
jobs:
  runtime-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Check live status and actual HLS segment
        id: probe
        continue-on-error: true
        env:
          STREAM_BASE_URL: https://multik-tv-test-stream-yltl.onrender.com
        run: |
          set +e
          python3 scripts/stream_autorepair.py 2>&1 | tee /tmp/stream-diagnosis.txt
          result=${PIPESTATUS[0]}
          {
            echo '## Автоматическая диагностика видеопотока'
            echo
            echo '- Проверка завершилась с кодом: '"$result"
            echo
            echo '```text'
            cat /tmp/stream-diagnosis.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$result"
      - name: Ask AI to diagnose and propose a minimal repair
        id: ai
        if: steps.probe.outcome == 'failure' && vars.ENABLE_AI_REPAIR == 'true'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.5
        run: python3 scripts/ai_stream_repair.py
      - name: Validate AI patch
        id: validate_ai
        if: steps.ai.outcome == 'success' && hashFiles('ai-repair.patch') != ''
        run: |
          python3 -m py_compile scripts/stream_autorepair.py scripts/ai_stream_repair.py
          bash -n stream-server/render-start.sh
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Open pull request with validated AI repair
        if: steps.validate_ai.outcome == 'success'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: ai/stream-autorepair
          delete-branch: true
          title: 'AI repair: fix stream runtime failure'
          body: 'Automated, constrained AI-proposed repair. Review the diff and CI results before merging or deploying.'
          commit-message: 'AI repair: address stream runtime diagnosis'
          add-paths: |
            stream-server/render-start.sh
            scripts/stream_autorepair.py
      - name: Create or update diagnostic issue
        if: steps.probe.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$(cat "$GITHUB_STEP_SUMMARY")"
          if [ -z "$body" ]; then body='Автоматическая проверка обнаружила сбой видеопотока. Подробности: откройте журнал запуска GitHub Actions.'; fi
          issue="$(gh issue list --state open --search 'in:title Эфир недоступен авто-диагностика' --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then gh issue comment "$issue" --body "$body"; else gh issue create --title 'Эфир недоступен — авто-диагностика' --body "$body"; fi
      - name: Mark check failed
        if: steps.probe.outcome == 'failure'
        run: exit 1
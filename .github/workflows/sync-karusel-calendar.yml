name: Sync Karusel calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"
  pull_request:
    paths:
      - "scripts/sync-karusel-calendar.py"
      - ".github/workflows/sync-karusel-calendar.yml"

permissions:
  contents: read

concurrency:
  group: karusel-calendar-sync
  cancel-in-progress: false

jobs:
  sync-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate calendar from official source
        run: python scripts/sync-karusel-calendar.py

      - name: Validate generated calendar
        run: python -m json.tool broadcast/karusel-calendar.json > /dev/null

      - name: Upload generated calendar
        uses: actions/upload-artifact@v4
        with:
          name: karusel-calendar
          path: broadcast/karusel-calendar.json
          if-no-files-found: error
          retention-days: 14

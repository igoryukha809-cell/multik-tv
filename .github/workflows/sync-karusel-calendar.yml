name: Sync official Karusel calendar
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: karusel-calendar-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch official calendar
        run: python scripts/sync-karusel-calendar.py
      - name: Commit changes when official dates changed
        run: |
          if git diff --quiet -- broadcast/karusel-calendar.json; then
            echo "No official calendar changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add broadcast/karusel-calendar.json
          git commit -m "Sync official Karusel award and contest dates"
          git push

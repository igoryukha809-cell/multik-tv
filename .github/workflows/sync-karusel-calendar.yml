name: Sync Karusel calendar

on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * *"

permissions:
  contents: write

concurrency:
  group: sync-karusel-calendar
  cancel-in-progress: false

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official calendar
        run: python scripts/sync-karusel-calendar.py
      - name: Commit updated calendar
        run: |
          if git diff --quiet -- broadcast/karusel-calendar.json; then
            echo "Calendar has no changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add broadcast/karusel-calendar.json
          git commit -m "Update Karusel calendar"
          git push

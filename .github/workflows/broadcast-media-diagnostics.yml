name: Read-only broadcast audio-video diagnostics
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: read
  issues: write
jobs:
  inspect-live-hls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Inspect live HLS
        run: |
          python3 scripts/broadcast_media_probe.py | tee /tmp/broadcast-report.json
          {
            echo "## Проверка изображения и звука"
            cat /tmp/broadcast-report.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: AI review of sampled video and audio
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          STREAM_URL: https://multik-tv-test-stream-yltl.onrender.com/live/multiktv.m3u8
        run: |
          python3 scripts/ai_broadcast_review.py | tee /tmp/broadcast-ai-report.json
          {
            echo "## ИИ-анализ видео и звука"
            cat /tmp/broadcast-ai-report.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Explain AI review is not configured
        if: ${{ env.OPENAI_API_KEY == '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: echo "ИИ-анализ пропущен: добавьте OPENAI_API_KEY в GitHub Actions Secrets." >> "$GITHUB_STEP_SUMMARY"
      - name: Broadcast recovery controller (safe dry-run)
        if: always()
        run: python3 scripts/broadcast_recovery_controller.py | tee /tmp/broadcast-recovery-report.json
      - name: Upload recovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broadcast-recovery-report
          path: /tmp/broadcast-recovery-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Agent triage and deduplicated alert
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/broadcast_agent_triage.py
      - name: Upload AI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broadcast-ai-review
          path: /tmp/broadcast-ai-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broadcast-media-diagnostic
          path: /tmp/broadcast-report.json
          if-no-files-found: ignore
          retention-days: 7

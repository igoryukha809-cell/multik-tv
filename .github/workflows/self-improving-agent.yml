name: Self-improving repository agent
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'stream-server/**'
      - '.github/workflows/**'
      - 'live.html'
      - 'channel.html'
      - 'broadcast.json'
      - 'render.yaml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: multik-tv-self-audit
  cancel-in-progress: true
jobs:
  self-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install YAML validator
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Validate workflow YAML
        run: |
          python - <<'PY'
          import pathlib, yaml
          files = sorted(pathlib.Path('.github/workflows').glob('*.yml'))
          files += sorted(pathlib.Path('.github/workflows').glob('*.yaml'))
          assert files, 'No GitHub Actions workflows found'
          for path in files:
              with path.open(encoding='utf-8') as f:
                  yaml.safe_load(f)
              print('YAML OK:', path)
          PY
      - name: Audit the agent and repository
        run: python scripts/self_improving_agent.py
      - name: Probe live stream and real media segment
        id: stream
        continue-on-error: true
        env:
          STREAM_BASE_URL: https://multik-tv-test-stream-yltl.onrender.com
        run: python scripts/stream_autorepair.py
      - name: Save audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multik-tv-self-audit-${{ github.run_id }}
          path: |
            self-audit-report.json
            stream-diagnosis.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Fail if runtime probe failed
        if: steps.stream.outcome == 'failure'
        run: |
          echo 'Live stream probe failed. See the self-audit artifact and runtime diagnostics.'
          exit 1

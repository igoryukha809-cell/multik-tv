name: Multik TV free automation
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
concurrency:
  group: multik-tv-autopilot
  cancel-in-progress: false
jobs:
  refresh-program-guide:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
      - name: Generate automated service heartbeat
        run: |
          mkdir -p data
          python3 - <<'PY'
          import json, datetime, pathlib
          now = datetime.datetime.now(datetime.timezone.utc)
          data = {
            "service": "МУЛЬТИК ТВ",
            "mode": "program-guide-only",
            "updated_at": now.isoformat(),
            "automation": "GitHub Actions scheduled task",
            "status": "ok",
            "notice": "Это автоматическое обновление расписания сайта, а не видеотрансляция 24/7.",
            "streaming": False,
            "items": [
              {"title":"Pepper & Carrot — Эпизод 6 (русская версия)","credit":"Morevna Project","license":"CC BY-SA 4.0","source":"https://commons.wikimedia.org/wiki/File:Morevna_Project_-_Pepper%26Carrot_(animated_comic)_-_Episode_6_-_The_Potion_Contest_(Russian_variant).webm"},
              {"title":"Elephants Dream","credit":"Blender Foundation / Orange Open Movie Team","license":"CC BY-SA 2.5","source":"https://orange.blender.org/"},
              {"title":"Caminandes — Llama Drama","credit":"Pablo Vazquez, Beorn Leonard, Francesco Siddi","license":"CC BY 3.0","source":"https://www.blender.org/about/projects/"},
            ]
          }
          pathlib.Path("data/autopilot.json").write_text(json.dumps(data, ensure_ascii=False, indent=2)+"\n")
          PY
      - name: Publish updated guide data
        run: |
          if git diff --quiet -- data/autopilot.json; then
            echo "No guide changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/autopilot.json
            git commit -m "Refresh Multik TV automated program guide"
            git push
          fi

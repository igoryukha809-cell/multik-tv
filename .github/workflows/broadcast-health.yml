name: МУЛЬТИК ТВ — проверка эфира

on:
  push:
    paths:
      - ".github/workflows/broadcast-health.yml"
      - "scripts/stream_autorepair.py"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: broadcast-health
  cancel-in-progress: true

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Проверить сайт канала
        id: site
        shell: bash
        run: |
          code=$(curl -L -sS -o /tmp/site.html -w "%{http_code}" --max-time 25 https://igoryukha809-cell.github.io/multik-tv/)
          echo "HTTP $code"
          test "$code" = "200"
          grep -qi "МУЛЬТИК ТВ" /tmp/site.html

      - name: Проверить погодный API
        id: weather
        shell: bash
        run: |
          curl -fsS --max-time 25 "https://api.open-meteo.com/v1/forecast?latitude=53.35&longitude=83.76&current=temperature_2m,weather_code&timezone=auto" -o /tmp/weather.json
          python3 -c 'import json; d=json.load(open("/tmp/weather.json")); assert "current" in d and "temperature_2m" in d["current"]; print("Погодные данные получены:", d["current"]["temperature_2m"], d["current"].get("temperature_2m_unit","°C"))'

      - name: Получить код диагностики
        uses: actions/checkout@v4

      - name: Проверить реальное состояние HLS-эфира
        id: stream
        env:
          STREAM_BASE_URL: https://multik-tv-test-stream-yltl.onrender.com
        shell: bash
        run: |
          python3 scripts/stream_autorepair.py

      - name: Итог проверки
        if: always()
        shell: bash
        run: |
          {
            echo "## Автоматическая проверка МУЛЬТИК ТВ"
            echo ""
            echo "- Сайт: ${{ steps.site.outcome }}"
            echo "- Погодный API: ${{ steps.weather.outcome }}"
            echo "- HLS-видеопоток: ${{ steps.stream.outcome }}"
            echo ""
            echo "HLS-проверка теперь проверяет health.json, цепочку плейлистов и скачивание реального медиасегмента. Ошибка HLS делает проверку неуспешной."
            echo "Проверка выполняется каждые 15 минут. Она обнаруживает сбои, но сама по себе не перезапускает Render."
          } >> "$GITHUB_STEP_SUMMARY"

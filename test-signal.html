<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тестовый видеосигнал — МУЛЬТИК ТВ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100c25;color:#fff;font-family:system-ui,Arial,sans-serif}
main{height:100%;display:grid;place-items:center;position:relative;text-align:center;isolation:isolate;background:linear-gradient(130deg,#151047,#45218a,#087e9b,#7a2b8b,#151047);background-size:400% 400%;animation:bg 18s ease infinite}
main:before{content:"";position:absolute;inset:-40%;z-index:-1;background:repeating-linear-gradient(115deg,transparent 0 70px,#ffffff12 71px 74px);animation:slide 24s linear infinite}
h1{font-size:clamp(36px,9vw,100px);margin:0;color:#ffe17b;text-shadow:0 5px 25px #0008;letter-spacing:.06em}
p{font-size:clamp(14px,2.5vw,26px);margin:14px;color:#fff}
.logo{font-size:clamp(48px,10vw,110px);animation:float 3s ease-in-out infinite}
.tag{display:inline-block;padding:9px 18px;border:2px solid #ffe17b;border-radius:99px;color:#ffe17b;font-weight:900;letter-spacing:.12em}
footer{position:absolute;bottom:16px;left:0;right:0;font-size:clamp(10px,1.5vw,16px);color:#ffffffc9}
@keyframes bg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}@keyframes slide{to{transform:translateX(150px)}}@keyframes float{50%{transform:translateY(-14px) rotate(4deg)}}
</style></head>
<body><main><div><div class="logo">🌈</div><h1>МУЛЬТИК ТВ</h1><p>Тестовый видеосигнал платформы</p><span class="tag">TEST SIGNAL · НЕ ПРЯМОЙ ЭФИР</span></div><footer>Техническая заставка для проверки плеера · <span id="clock"></span></footer></main>
<script>const clock=document.getElementById('clock');function tick(){clock.textContent=new Date().toLocaleString('ru-RU',{dateStyle:'medium',timeStyle:'medium',timeZone:'UTC'})+' UTC'}tick();setInterval(tick,1000)</script>
</body></html>

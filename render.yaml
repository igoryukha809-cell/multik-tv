services:
  - type: web
    name: multik-tv-test-stream
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: stream-server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /live/multiktv.m3u8
    autoDeploy: false
    envVars:
      - key: PORT
        value: "10000"

  - type: web
    name: multik-tv-storage-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: storage-api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"

services:
  - type: web
    name: multik-tv-test-stream
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: stream-server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /live/multiktv.m3u8
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: BROADCAST_TZ
        value: Asia/Krasnoyarsk
      - key: WEATHER_TIME
        value: "10:00"

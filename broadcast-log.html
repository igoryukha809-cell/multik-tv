<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7132a8"><title>Журнал эфира — МУЛЬТИК ТВ</title><link rel="stylesheet" href="styles.css">
<style>
main{max-width:900px;margin:auto;padding:16px}.panel{background:#fff;color:#30215b;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #35136b22}input,select,textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #d8cde5;border-radius:10px;margin:6px 0 12px;font:inherit}button,.btn{border:0;border-radius:11px;padding:12px 15px;margin:4px;background:#7132a8;color:white;font-weight:700;cursor:pointer}.secondary{background:#eee7f6;color:#30215b}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:#655b78;font-size:14px}.entry{border-bottom:1px solid #eee6f5;padding:12px 0}.entry:last-child{border:0}.time{font-variant-numeric:tabular-nums;font-weight:700}.actions{display:flex;flex-wrap:wrap;gap:6px}@media(max-width:520px){.row{grid-template-columns:1fr}}
</style></head><body><header><div class="logo">🌈 МУЛЬТИК ТВ</div><p>Журнал фактического эфира</p></header><main><a class="btn secondary" href="index.html">← На главную</a><h1>📝 Журнал эфира</h1><p class="muted">Записывай, что действительно вышло в эфир, отмечай время и замечания. Записи хранятся только в этом браузере.</p>
<section class="panel"><h2>Новая запись</h2><label for="kind">Тип события</label><select id="kind"><option>Начало передачи</option><option>Конец передачи</option><option>Заставка</option><option>Реклама / объявление</option><option>Техническая пауза</option><option>Сбой воспроизведения</option><option>Другое событие</option></select><label for="program">Название передачи или события</label><input id="program" maxlength="120" placeholder="Например: Приключения котёнка"><div class="row"><div><label for="when">Время события</label><input id="when" type="datetime-local"></div><div><label for="duration">Длительность (минуты, необязательно)</label><input id="duration" type="number" min="0" max="1440" placeholder="15"></div></div><label for="note">Заметка</label><textarea id="note" rows="3" maxlength="1000" placeholder="Что произошло, замечания оператора..."></textarea><button id="add">Добавить в журнал</button><button id="now" class="secondary">Поставить текущее время</button></section>
<section class="panel"><h2>Записи выпуска</h2><div id="count" class="muted">Записей: 0</div><div id="entries" aria-live="polite"></div><div class="actions"><button id="txt">Скачать TXT</button><button id="csv" class="secondary">Скачать CSV</button><button id="json" class="secondary">Экспорт JSON</button><button id="import" class="secondary">Импорт JSON</button><input id="file" type="file" accept="application/json,.json" hidden><button id="clear" class="secondary">Очистить журнал</button></div></section></main>
<script>
const KEY='multik-tv-broadcast-log-v1', $=id=>document.getElementById(id);let entries=[];try{entries=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(entries))entries=[];}catch(e){entries=[];}
function localNow(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
$('when').value=localNow();function save(){localStorage.setItem(KEY,JSON.stringify(entries));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){$('count').textContent='Записей: '+entries.length;$('entries').innerHTML=entries.length?entries.slice().reverse().map((e,i)=>'<article class="entry"><div class="time">'+esc(new Date(e.when).toLocaleString('ru-RU'))+'</div><b>'+esc(e.kind)+'</b> — '+esc(e.program||'Без названия')+(e.duration?'<div class="muted">Длительность: '+esc(e.duration)+' мин.</div>':'')+(e.note?'<p>'+esc(e.note).replace(/\n/g,'<br>')+'</p>':'')+'<button class="secondary" data-del="'+(entries.length-1-i)+'">Удалить</button></article>').join(''):'<p class="muted">Пока нет записей. Добавь первое событие выпуска.</p>';document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{entries.splice(Number(b.dataset.del),1);save()})}
$('add').onclick=()=>{if(!$('when').value){alert('Укажи время события.');return}entries.push({id:Date.now()+'-'+Math.random().toString(36).slice(2,7),kind:$('kind').value,program:$('program').value.trim(),when:new Date($('when').value).toISOString(),duration:$('duration').value,note:$('note').value.trim()});$('program').value='';$('duration').value='';$('note').value='';$('when').value=localNow();save()};
$('now').onclick=()=>$('when').value=localNow();
function download(name,data,type){const u=URL.createObjectURL(new Blob([data],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
$('txt').onclick=()=>download('multik-tv-log.txt','МУЛЬТИК ТВ — ЖУРНАЛ ЭФИРА\n'+entries.map(e=>new Date(e.when).toLocaleString('ru-RU')+' | '+e.kind+' | '+e.program+' | '+(e.duration||'')+' мин.\n'+e.note).join('\n\n'),'text/plain;charset=utf-8');
$('csv').onclick=()=>download('multik-tv-log.csv','Время;Тип;Передача;Длительность, мин;Заметка\n'+entries.map(e=>[new Date(e.when).toLocaleString('ru-RU'),e.kind,e.program,e.duration,e.note].map(csvCell).join(';')).join('\n'),'text/csv;charset=utf-8');
$('json').onclick=()=>download('multik-tv-log.json',JSON.stringify(entries,null,2),'application/json');
$('import').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];if(!f)return;try{const v=JSON.parse(await f.text());if(!Array.isArray(v)||v.some(e=>!e||typeof e.kind!=='string'||typeof e.when!=='string'))throw Error();entries=v;save();alert('Импортировано записей: '+entries.length)}catch(e){alert('Не удалось прочитать журнал JSON.')}finally{$('file').value=''}};
$('clear').onclick=()=>{if(confirm('Удалить все записи этого журнала?')){entries=[];save()}};render();
</script></body></html>
